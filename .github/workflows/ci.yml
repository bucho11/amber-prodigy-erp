name: CI

# Per-increment quality gate (AUTONOMOUS_BUILD_FRAMEWORK.md P2): typecheck + build + live-DB
# tests on every push and PR. The tests run against a real Postgres service (TEST_DATABASE_URL),
# mirroring how the app actually talks to the database.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prodigy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/prodigy_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (live DB)
        run: npm test
